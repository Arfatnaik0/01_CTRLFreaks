version: '3.8'

services:
  # Kafka and Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - iot-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - iot-network

  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: iot_energy_db
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - iot-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - iot-network

  # Flask API Service
  flask-api:
    build: ./iot-system/flask-api
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      DATABASE_URL: postgresql://iot_user:iot_password@postgres:5432/iot_energy_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
    networks:
      - iot-network
    volumes:
      - ./iot-system/flask-api:/app

  # Data Processor Service
  data-processor:
    build: ./iot-system/data-processor
    depends_on:
      - postgres
      - kafka
    environment:
      DATABASE_URL: postgresql://iot_user:iot_password@postgres:5432/iot_energy_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: "INFO"
    networks:
      - iot-network
    volumes:
      - ./iot-system/data-processor:/app

  # Sensor Simulator Service
  sensor-simulator:
    build: ./iot-system/sensor-simulator
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SENSOR_DATA_INTERVAL: "2.0"
      LOG_LEVEL: "INFO"
    networks:
      - iot-network
    volumes:
      - ./iot-system/sensor-simulator:/app

  # ML Engine Service
  ml-engine:
    build: ./iot-system/ml-engine
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://iot_user:iot_password@postgres:5432/iot_energy_db
    networks:
      - iot-network
    volumes:
      - ./iot-system/ml-engine:/app

  # Control System Service
  control-system:
    build: ./iot-system/control-system
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
    networks:
      - iot-network
    volumes:
      - ./iot-system/control-system:/app

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - iot-network

volumes:
  postgres_data:
  grafana_data:

networks:
  iot-network:
    driver: bridge

    