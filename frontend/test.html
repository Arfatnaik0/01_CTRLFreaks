<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1f2937; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #374151; padding: 20px; margin: 10px 0; border-radius: 8px; }
        .loading { text-align: center; padding: 40px; }
        .error { color: #ef4444; }
        .success { color: #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IoT System API Test</h1>
        <div id="status" class="loading">Testing API connections...</div>
        <div id="results"></div>
    </div>

    <script>
        async function testAPI() {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            
            try {
                // Test system stats
                const statsResponse = await fetch('http://localhost:5000/api/system-stats');
                const stats = await statsResponse.json();
                
                // Test devices
                const devicesResponse = await fetch('http://localhost:5000/api/devices');
                const devices = await devicesResponse.json();
                
                // Test alerts
                const alertsResponse = await fetch('http://localhost:5000/api/alerts');
                const alerts = await alertsResponse.json();
                
                status.innerHTML = '<span class="success">✅ API connections successful!</span>';
                
                results.innerHTML = `
                    <div class="card">
                        <h3>System Stats</h3>
                        <p>Total Devices: ${stats.total_devices || 0}</p>
                        <p>Active Devices: ${stats.active_devices || 0}</p>
                        <p>Active Alerts: ${stats.active_alerts || 0}</p>
                        <p>Energy Consumption: ${stats.total_energy_consumption || 0} kWh</p>
                    </div>
                    
                    <div class="card">
                        <h3>Devices (First 3)</h3>
                        ${devices.slice(0, 3).map(device => `
                            <p><strong>${device.device_id}</strong> - ${device.location} (${device.status})</p>
                        `).join('')}
                    </div>
                    
                    <div class="card">
                        <h3>Recent Alerts (First 3)</h3>
                        ${alerts.slice(0, 3).map(alert => `
                            <p><strong>${alert.device_id}</strong> - ${alert.message}</p>
                        `).join('')}
                    </div>
                `;
                
            } catch (error) {
                status.innerHTML = `<span class="error">❌ API Error: ${error.message}</span>`;
                console.error('API Test Error:', error);
            }
        }
        
        // Run test when page loads
        testAPI();
        
        // Refresh every 10 seconds
        setInterval(testAPI, 10000);
    </script>
</body>
</html>
