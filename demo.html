<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard - Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 20px 0; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: #f9f9f9; }
        .device { border: 1px solid #ccc; border-radius: 4px; padding: 10px; margin: 5px 0; background: white; }
        .device.online { border-left: 4px solid #22c55e; }
        .device.offline { border-left: 4px solid #ef4444; }
        .status { font-weight: bold; }
        .online { color: #22c55e; }
        .offline { color: #ef4444; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2563eb; }
        .refresh-btn { float: right; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IoT Manufacturing Plant Dashboard</h1>
        <p>Backend Status: <span id="backend-status">Checking...</span></p>
        <button class="refresh-btn" onclick="refreshData()">Refresh Data</button>
        
        <div class="grid">
            <div class="card">
                <h3>System Health</h3>
                <div id="health-info">Loading...</div>
            </div>
            
            <div class="card">
                <h3>Device List</h3>
                <div id="device-list">Loading...</div>
            </div>
            
            <div class="card">
                <h3>Recent Sensor Data</h3>
                <div id="sensor-data">Loading...</div>
            </div>
            
            <div class="card">
                <h3>Analytics Overview</h3>
                <div id="analytics-data">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5001/api';
        
        async function checkBackend() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('backend-status').innerHTML = `<span class="online">✓ Connected</span>`;
                return true;
            } catch (error) {
                document.getElementById('backend-status').innerHTML = `<span class="offline">✗ Disconnected</span>`;
                return false;
            }
        }
        
        async function loadDevices() {
            try {
                const response = await fetch(`${API_BASE}/devices/status`);
                const data = await response.json();
                const deviceList = document.getElementById('device-list');
                
                if (!data.devices || data.devices.length === 0) {
                    deviceList.innerHTML = '<p>No devices found. Make sure the simulator is running.</p>';
                    return;
                }
                
                deviceList.innerHTML = data.devices.map(device => `
                    <div class="device online">
                        <strong>${device.device_id}</strong> (${device.device_type})
                        <div class="status online">ACTIVE</div>
                        <div>Avg Current: ${device.avg_current.toFixed(2)}A | Avg Temp: ${device.avg_temperature.toFixed(2)}°C | Avg Pressure: ${device.avg_pressure.toFixed(2)} PSI</div>
                        <div>Readings: ${device.reading_count}</div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('device-list').innerHTML = '<p>Failed to load devices</p>';
            }
        }
        
        async function loadSensorData() {
            try {
                const response = await fetch(`${API_BASE}/latest-readings`);
                const data = await response.json();
                const sensorData = document.getElementById('sensor-data');
                
                if (!data.readings || data.readings.length === 0) {
                    sensorData.innerHTML = '<p>No sensor data available</p>';
                    return;
                }
                
                sensorData.innerHTML = data.readings.slice(0, 10).map(reading => `
                    <div class="device">
                        <strong>${reading.device_id}</strong> (${reading.device_type})
                        <div>Current: ${reading.current}A | Temp: ${reading.temperature}°C | Pressure: ${reading.pressure} PSI</div>
                        <div>Relay: <span class="${reading.relay_status === 'ON' ? 'online' : 'offline'}">${reading.relay_status}</span></div>
                        <div style="font-size: 0.9em; color: #666;">${new Date(reading.timestamp).toLocaleString()}</div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('sensor-data').innerHTML = '<p>Failed to load sensor data</p>';
            }
        }
        
        async function loadHealthInfo() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const health = await response.json();
                document.getElementById('health-info').innerHTML = `
                    <div>Database: <span class="${health.database === 'healthy' ? 'online' : 'offline'}">${health.database}</span></div>
                    <div>Status: <span class="${health.status === 'healthy' ? 'online' : 'offline'}">${health.status}</span></div>
                    <div>Last Check: ${new Date(health.timestamp).toLocaleString()}</div>
                `;
            } catch (error) {
                document.getElementById('health-info').innerHTML = '<p>Failed to load health info</p>';
            }
        }
        
        async function loadAnalytics() {
            try {
                const response = await fetch(`${API_BASE}/analytics/overview`);
                const data = await response.json();
                const analyticsData = document.getElementById('analytics-data');
                
                if (!data.analytics) {
                    analyticsData.innerHTML = '<p>No analytics data available</p>';
                    return;
                }
                
                const analytics = data.analytics;
                analyticsData.innerHTML = `
                    <div><strong>Active Devices:</strong> ${analytics.active_devices}</div>
                    <div><strong>Average Current:</strong> ${analytics.averages.current.toFixed(2)}A</div>
                    <div><strong>Average Temperature:</strong> ${analytics.averages.temperature.toFixed(2)}°C</div>
                    <div><strong>Average Pressure:</strong> ${analytics.averages.pressure.toFixed(2)} PSI</div>
                    <hr style="margin: 10px 0;">
                    <div><strong>Alerts:</strong></div>
                    <div>High Current: <span class="${analytics.alert_counts.high_current > 0 ? 'offline' : 'online'}">${analytics.alert_counts.high_current}</span></div>
                    <div>High Temperature: <span class="${analytics.alert_counts.high_temperature > 0 ? 'offline' : 'online'}">${analytics.alert_counts.high_temperature}</span></div>
                    <div>High Pressure: <span class="${analytics.alert_counts.high_pressure > 0 ? 'offline' : 'online'}">${analytics.alert_counts.high_pressure}</span></div>
                `;
            } catch (error) {
                document.getElementById('analytics-data').innerHTML = '<p>Failed to load analytics data</p>';
            }
        }
        
        async function refreshData() {
            await checkBackend();
            await loadHealthInfo();
            await loadDevices();
            await loadSensorData();
            await loadAnalytics();
        }
        
        // Initial load
        refreshData();
        
        // Auto-refresh every 10 seconds
        setInterval(refreshData, 10000);
    </script>
</body>
</html>
